<style>
:root{
 --burdeos:#6b2435;--burdeos-osc:#4a1825;--crema:#f5f1ea;--papel:#fffdf9;
 --tinta:#2b2420;--gris:#8a8178;--linea:#e4ddd0;
 --verde:#3f7d4e;--verde-bg:#e6f0e6;--ambar:#b9772a;--ambar-bg:#f8ecda;
 --rojo:#b13a3a;--rojo-bg:#f6e2e0;--neutro:#9a9189;--neutro-bg:#ece7df;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Archivo',sans-serif;background:var(--crema);color:var(--tinta);
 -webkit-font-smoothing:antialiased;line-height:1.45;overflow:hidden}
.serif{font-family:'Fraunces',serif}

/* header */
header{background:var(--burdeos);color:#f5e9dd;padding:9px 14px;
 display:flex;align-items:center;gap:10px;position:relative;z-index:20}
.brand{line-height:1}
.brand .b1{font-family:'Fraunces',serif;font-weight:700;font-size:16px;letter-spacing:.4px;display:block}
.brand .b2{font-size:8px;letter-spacing:2.2px;color:#d9a9b4;margin-top:2px}
.hmeta{margin-left:auto;text-align:right}
.hmeta .ht{font-family:'Fraunces',serif;font-size:13px}
.hmeta .hd{font-size:9.5px;color:#d9a9b4;letter-spacing:.4px}

/* screens */
.app{height:calc(100% - 56px - var(--hh,52px));position:relative}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
.screen.on{display:block}

/* catalogo */
.viewerbox{background:#efe9df;min-height:100%;padding-bottom:14px}
.pagewrap{position:relative;background:#efe9df}
.pagewrap img{width:100%;display:block}
.pfloat{position:sticky;top:8px;z-index:5;display:flex;justify-content:center;
 gap:8px;margin:8px 0 0;pointer-events:none}
.pfloat>*{pointer-events:auto}
.pbtn{width:42px;height:42px;border-radius:50%;border:none;background:var(--burdeos);
 color:#fff;font-size:19px;box-shadow:0 3px 12px rgba(74,24,37,.4);display:flex;
 align-items:center;justify-content:center}
.pbtn:disabled{opacity:.32}
.pind{background:var(--burdeos);color:#fff;border-radius:21px;padding:0 14px;
 height:42px;display:flex;align-items:center;font-family:'Fraunces',serif;font-size:13px;
 box-shadow:0 3px 12px rgba(74,24,37,.4);gap:5px}
.pind input{width:42px;background:rgba(255,255,255,.16);border:none;color:#fff;
 font-family:'Archivo';font-size:13px;text-align:center;border-radius:6px;padding:4px 0}
.swipehint{text-align:center;font-size:10.5px;color:var(--gris);padding:6px}

/* stock de pagina */
.stockcard{background:var(--papel);margin:10px 12px 0;border:1px solid var(--linea);
 border-radius:13px;overflow:hidden}
.sc-h{padding:12px 14px;display:flex;align-items:center;gap:8px;background:#f3e7ea}
.sc-h h3{font-family:'Fraunces',serif;font-size:14px;font-weight:600;color:var(--burdeos)}
.sc-h .cnt{margin-left:auto;font-size:11px;color:var(--gris)}

/* filas producto */
.row{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--linea);align-items:flex-start}
.row:first-child{border-top:none}
.row.tap:active{background:var(--crema)}
.rinfo{flex:1;min-width:0}
.rname{font-size:13.5px;font-weight:600;line-height:1.3}
.rsku{font-size:10.5px;color:var(--gris);margin-top:2px;letter-spacing:.3px}
.rmeta{font-size:11px;color:var(--gris);margin-top:2px}
.rprice{font-family:'Fraunces',serif;font-size:12.5px;font-weight:600;margin-top:3px}
.rprice s{font-size:9px;color:var(--gris);font-weight:400;text-decoration:none}
.rpag{font-size:10px;color:var(--burdeos);font-weight:600;margin-top:3px}
.badge{flex-shrink:0;border-radius:9px;padding:7px 9px;text-align:center;min-width:82px}
.badge b{font-family:'Fraunces',serif;font-size:19px;display:block;line-height:1}
.badge span{font-size:8.5px;letter-spacing:.5px;text-transform:uppercase;font-weight:700}
.b-ok{background:var(--verde-bg);color:var(--verde)}
.b-low{background:var(--ambar-bg);color:var(--ambar)}
.b-no{background:var(--rojo-bg);color:var(--rojo)}
.b-na{background:var(--neutro-bg);color:var(--neutro)}
.empty{padding:30px 22px;text-align:center;color:var(--gris);font-size:13px}

/* buscar */
.searchbar{position:sticky;top:0;z-index:8;background:var(--crema);padding:12px 12px 8px}
.searchbar input{width:100%;font-family:'Archivo';font-size:15px;padding:13px 14px;
 border:1px solid var(--linea);border-radius:12px;background:var(--papel);color:var(--tinta)}
.searchbar input:focus{outline:2px solid #d9a9b4;border-color:var(--burdeos)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 12px 4px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font-size:12px;font-weight:600;padding:7px 13px;border-radius:20px;
 border:1px solid var(--linea);background:var(--papel);color:var(--gris)}
.chip.on{background:var(--burdeos);color:#fff;border-color:var(--burdeos)}
.subbar{display:flex;align-items:center;padding:4px 14px 8px;gap:10px}
.toggle{display:flex;align-items:center;gap:7px;font-size:12.5px}
.toggle input{accent-color:var(--burdeos);width:17px;height:17px}
.rescount{margin-left:auto;font-size:11px;color:var(--gris)}

.pgroup{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--burdeos);
 font-weight:700;padding:14px 14px 4px}
.listcard{background:var(--papel);margin:0 12px 8px;border:1px solid var(--linea);border-radius:13px;overflow:hidden}

/* lista / stats / acciones */
.statstrip{display:flex;gap:8px;padding:12px}
.stat{flex:1;background:var(--papel);border:1px solid var(--linea);border-radius:12px;
 padding:10px 6px;text-align:center}
.stat b{font-family:'Fraunces',serif;font-size:19px;display:block;color:var(--burdeos)}
.stat span{font-size:9px;letter-spacing:.4px;text-transform:uppercase;color:var(--gris)}
.actions{display:flex;gap:8px;padding:0 12px 6px}
.act{flex:1;font-family:'Archivo';font-size:12.5px;font-weight:600;padding:12px 8px;
 border-radius:11px;border:1px solid var(--burdeos);background:var(--burdeos);color:#fff;
 display:flex;align-items:center;justify-content:center;gap:6px}
.act.ghost{background:var(--papel);color:var(--burdeos)}
.act:active{opacity:.8}

/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;height:56px;background:var(--papel);
 border-top:1px solid var(--linea);display:flex;z-index:30;
 padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:none;background:none;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:3px;color:var(--gris);font-family:'Archivo'}
.nav button.on{color:var(--burdeos)}
.nav .ico{font-size:19px}
.nav .lbl{font-size:10px;font-weight:600}
.nav button.on .lbl{font-weight:700}

.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);
 background:var(--burdeos-osc);color:#fff;padding:11px 18px;border-radius:10px;font-size:12.5px;
 box-shadow:0 6px 22px rgba(0,0,0,.3);opacity:0;transition:opacity .3s;z-index:40;
 pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.legend{padding:10px 14px 20px;font-size:10.5px;color:var(--gris);line-height:1.9}
.legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
</style>
</head>
<body>
<header>
 <div class="brand"><span class="b1">GRUPO MUNDO</span><span class="b2">INTERNATIONAL IMPORT</span></div>
 <div class="hmeta"><div class="ht">App GM</div><div class="hd" id="hd">Actualizado</div></div>
</header>

<div class="app">
 <!-- CATALOGO -->
 <div class="screen on" id="scCat">
  <div class="viewerbox">
   <div class="pagewrap" id="pagewrap">
    <div class="pfloat">

    <div id="scList"></div>
   </div>
  </div>
 </div>

 <!-- BUSCAR -->

  <div class="actions">
   <button class="act" id="btnUpload">↑ Actualizar stock</button>
   <button class="act ghost" id="btnCsv">↓ Exportar CSV</button>
  </div>
  <input type="file" id="fileIn" accept=".xlsx,.xls" style="display:none">
  <div id="fullList"></div>
  <div class="legend">
   <span class="dot" style="background:#3f7d4e"></span>Disponible (10+)&nbsp;&nbsp;
   <span class="dot" style="background:#b9772a"></span>Stock bajo (1-9)<br>
   <span class="dot" style="background:#b13a3a"></span>Sin stock (0)&nbsp;&nbsp;
   <span class="dot" style="background:#9a9189"></span>Sin dato — consultar<br>
   Grupo Mundo · ventas@grupomundo.com.ar · 11 3783 3045
  </div>
 </div>
</div>

<div class="nav">
 <button class="on" id="navCat"><span class="ico">📖</span><span class="lbl">Catálogo</span></button>

</div>

let stock=DATA.stock;
const norm=s=>String(s).trim().toUpperCase().replace(/ /g,'');
const fmt=n=>n.toLocaleString('es-AR');

function classify(sku){
 const k=norm(sku);
 if(!(k in stock))return{n:null,cls:'b-na',txt:'S/D',lbl:'Consultar'};
 const v=stock[k];
 if(v<=0)return{n:0,cls:'b-no',txt:'0',lbl:'Sin stock'};
 if(v<10)return{n:v,cls:'b-low',txt:v,lbl:'Stock bajo'};
 return{n:v,cls:'b-ok',txt:v,lbl:'Disponible'};
}
function rowHTML(p,tap){
 const c=classify(p.sku);
 return `<div class="row ${tap?'tap':''}" data-pag="${p.enCat?p.pag:0}">
  <div class="rinfo">
   <div class="rname">${p.nombre}</div>
   <div class="rsku">${p.sku}</div>
   ${p.color?`<div class="rmeta">${p.color}</div>`:''}
   ${p.precio?`<div class="rprice">$ ${fmt(p.precio)} <s>+ IVA</s></div>`:''}
   ${tap&&p.enCat?`<div class="rpag">Ver en página ${p.pag} ›</div>`:''}
  </div>
  <div class="badge ${c.cls}"><b>${c.txt}</b><span>${c.lbl}</span></div>
 </div>`;
}

/* ---- catalogo ---- */
let page=1;
function renderPage(){
 document.getElementById('pageImg').src=PAGES[page-1];
 document.getElementById('pInput').value=page;
 document.getElementById('prev').disabled=page<=1;
 document.getElementById('next').disabled=page>=100;
 const onP=DATA.productos.filter(p=>p.pag===page);
 document.getElementById('scCnt').textContent=onP.length?onP.length+' producto(s)':'';
 const l=document.getElementById('scList');
 if(!onP.length){
  document.getElementById('scTitle').textContent='Sin productos';
  l.innerHTML='<div class="empty">Portada o separador de sección. Deslizá para seguir navegando.</div>';
 }else{
  document.getElementById('scTitle').textContent='Stock en esta página';
  l.innerHTML=onP.map(p=>rowHTML(p,false)).join('');
 }
 document.querySelector('#scCat .screen,#scCat').scrollTop=0;
}
function goto(p){page=Math.max(1,Math.min(100,p));renderPage();}
document.getElementById('prev').onclick=()=>goto(page-1);
document.getElementById('next').onclick=()=>goto(page+1);
document.getElementById('pInput').onchange=e=>goto(+e.target.value);
// swipe
let tx=0,ty=0;
const pw=document.getElementById('pagewrap');
pw.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY;},{passive:true});
pw.addEventListener('touchend',e=>{
 const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
 if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.6){ goto(page+(dx<0?1:-1)); }
},{passive:true});

/* ---- filtros ---- */
const cats=[...new Set(DATA.productos.map(p=>p.cat))];
let curCat='';
const chips=document.getElementById('chips');
function chipBtn(val,lbl){const b=document.createElement('button');b.className='chip'+(val===curCat?' on':'');
 b.textContent=lbl;b.onclick=()=>{curCat=val;[...chips.children].forEach(c=>c.classList.remove('on'));
 b.classList.add('on');renderSearch();};return b;}
chips.appendChild(chipBtn('','Todas'));
cats.forEach(c=>chips.appendChild(chipBtn(c,c)));

function filtered(q,cat,only){
 return DATA.productos.filter(p=>{
  if(cat && p.cat!==cat)return false;
  if(only){const c=classify(p.sku);if(!c.n||c.n<=0)return false;}
  if(q){if(!norm(p.sku+p.nombre+p.color).includes(q))return false;}
  return true;
 });
}
function groupRender(arr,tap){
 let h='',cur='';
 arr.forEach(p=>{if(p.cat!==cur){cur=p.cat;h+=`<div class="pgroup">${cur}</div>`;}});
 // render por grupo en tarjetas
 h='';cur='';let buf=[];
 const flush=()=>{if(buf.length){h+='<div class="listcard">'+buf.join('')+'</div>';buf=[];}};
 arr.forEach(p=>{if(p.cat!==cur){flush();cur=p.cat;h+=`<div class="pgroup">${cur}</div>`;}
  buf.push(rowHTML(p,tap));});
 flush();
 return h;
}
function bindTaps(container){
 container.querySelectorAll('.row.tap').forEach(r=>{
  const pg=+r.dataset.pag;
  if(pg>0)r.onclick=()=>{goto(pg);setScreen('cat');};
 });
}
function renderSearch(){
 const q=norm(document.getElementById('search').value);
 const only=document.getElementById('onlyStock').checked;
 const f=filtered(q,curCat,only);
 document.getElementById('rescount').textContent=f.length+' resultado(s)';
 const c=document.getElementById('searchList');
 c.innerHTML=f.length?groupRender(f,true):'<div class="empty">Sin resultados para los filtros aplicados.</div>';
 bindTaps(c);
}
document.getElementById('search').addEventListener('input',renderSearch);
document.getElementById('onlyStock').addEventListener('change',renderSearch);

function renderFull(){
 const c=document.getElementById('fullList');
 c.innerHTML=groupRender(DATA.productos,true);
 bindTaps(c);
}
function refreshStats(){
 let piezas=0,disp=0,enCat=0;
 DATA.productos.forEach(p=>{const c=classify(p.sku);
  if(c.n){piezas+=c.n;if(c.n>0)disp++;}
  if(p.enCat&&c.n!==null)enCat++;});
 document.getElementById('stPiezas').textContent=fmt(piezas);
 document.getElementById('stDisp').textContent=disp;
 document.getElementById('stCat').textContent=enCat+'/'+DATA.productos.filter(p=>p.enCat).length;
}

/* ---- navegacion screens ---- */
function setScreen(s){
 document.getElementById('scCat').classList.toggle('on',s==='cat');
 document.getElementById('scSearch').classList.toggle('on',s==='search');
 document.getElementById('scList2').classList.toggle('on',s==='list');
 document.getElementById('navCat').classList.toggle('on',s==='cat');
 document.getElementById('navSearch').classList.toggle('on',s==='search');
 document.getElementById('navList').classList.toggle('on',s==='list');
 if(s==='search'){renderSearch();setTimeout(()=>document.getElementById('search').focus(),60);}
 if(s==='list'){refreshStats();renderFull();}
}
document.getElementById('navCat').onclick=()=>setScreen('cat');
document.getElementById('navSearch').onclick=()=>setScreen('search');
document.getElementById('navList').onclick=()=>setScreen('list');

/* ---- toast ---- */
function toast(m){const t=document.getElementById('toast');t.textContent=m;
 t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3600);}

/* ---- actualizar stock ---- */
document.getElementById('btnUpload').onclick=()=>document.getElementById('fileIn').click();
document.getElementById('fileIn').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const rd=new FileReader();
 rd.onload=ev=>{
  try{
   const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
   const ws=wb.Sheets[wb.SheetNames[0]];
   const rows=XLSX.utils.sheet_to_json(ws,{header:1});
   const hdr=rows[0].map(x=>String(x||'').trim().toLowerCase());
   let iCod=hdr.findIndex(h=>h.includes('cod')); if(iCod<0)iCod=0;
   let iSt=hdr.findIndex(h=>h.includes('fontenla')); if(iSt<0)iSt=hdr.length-1;
   const ns={};
   for(let i=1;i<rows.length;i++){const r=rows[i];if(!r||r[iCod]==null)continue;
    const k=norm(r[iCod]),v=parseInt(r[iSt]);ns[k]=isNaN(v)?0:v;}
   if(Object.keys(ns).length<5){toast('⚠ El archivo no tiene el formato esperado.');return;}
   stock=ns;
   const known=new Set(DATA.productos.map(p=>norm(p.sku)));
   Object.keys(ns).forEach(k=>{if(!known.has(k))
    DATA.productos.push({sku:k,nombre:k,color:'',precio:0,cat:'Fuera de catálogo 2026',pag:0,enCat:false});});
   const m=f.name.match(/(\d{1,2})[-_.](\d{1,2})/);
   DATA.fecha=m?(m[1]+'-'+m[2]+'-2026'):new Date().toLocaleDateString('es-AR');
   document.getElementById('hd').textContent='Actualizado '+DATA.fecha;
   refreshStats();renderFull();renderPage();
   toast('✓ Stock actualizado: '+f.name);
  }catch(err){toast('⚠ No se pudo leer el archivo.');}
 };
 rd.readAsArrayBuffer(f);e.target.value='';
};

/* ===== STOCK EN VIVO + PWA · Grupo Mundo ===== */
const STOCK_URL='./stock.csv';
function _parseStockCSV(txt){
 txt=txt.replace(/^﻿/,'');
 const lines=txt.split(/\r?\n/).filter(l=>l.trim()!=='');
 if(lines.length<2)return null;
 const d=(lines[0].split(';').length>lines[0].split(',').length)?';':',';
 const h=lines[0].split(d).map(x=>x.trim().toLowerCase());
 let iC=h.findIndex(x=>x.includes('cod')); let iS=h.findIndex(x=>x.includes('fontenla'));
 if(iC<0)iC=0; if(iS<0)iS=h.length-1;
 const ns={};
 for(let i=1;i<lines.length;i++){const r=lines[i].split(d); if(r[iC]==null)continue;
  const k=norm(r[iC]); if(!k)continue; const v=parseInt(r[iS]); ns[k]=isNaN(v)?0:v;}
 return ns;
}
async function loadLiveStock(showToast){
 try{
  const res=await fetch(STOCK_URL+'?v='+Date.now(),{cache:'no-store'});
  if(!res.ok)throw 0;
  const ns=_parseStockCSV(await res.text());
  if(!ns||Object.keys(ns).length<5)throw 0;
  stock=ns;
  const lm=res.headers.get('last-modified');
  DATA.fecha=lm?new Date(lm).toLocaleDateString('es-AR'):new Date().toLocaleDateString('es-AR');
  const hd=document.getElementById('hd'); if(hd)hd.textContent='🟢 En vivo · '+DATA.fecha;
  refreshStats();renderFull();renderPage();
  if(showToast)toast('✓ Stock actualizado en vivo');
 }catch(e){
  const hd=document.getElementById('hd'); if(hd)hd.textContent='🟡 Último stock '+DATA.fecha;
  if(showToast)toast('⚠ Sin conexión — mostrando último stock guardado');
 }
}
loadLiveStock(false);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden)loadLiveStock(false); });
(function(){var hd=document.getElementById('hd'); if(hd){hd.style.cursor='pointer'; hd.title='Tocá para actualizar el stock'; hd.addEventListener('click',()=>loadLiveStock(true));} })();

 @media(min-width:700px){ #cartWrap{align-items:center} #cartSheet{border-radius:16px} }
 `;
 document.head.appendChild(st);
 document.body.insertAdjacentHTML('beforeend',
  '<button id="cartFab" title="Ver mi pedido">🛒<span id="cartCnt">0</span></button>'+
  '<div id="cartWrap"><div id="cartSheet">'+
  '<div class="ch"><span>🛒 Mi pedido</span><button id="cartX">✕</button></div>'+
  '<div id="cartItems"></div>'+
  '<textarea id="cartNota" placeholder="Comentarios para ventas (sucursal, entrega, aclaraciones)…"></textarea>'+
  '<div id="cartTot"></div>'+
  '<div class="cbtns"><button id="cartClear">Vaciar</button><button id="cartSend">📲 Enviar pedido por WhatsApp</button></div>'+
  '<div class="cfoot">Al enviar se abre WhatsApp con la proforma dirigida a Ventas Grupo Mundo: la revisás y tocás enviar.</div>'+
  '</div></div>');
 try{ $('cartNota').value=localStorage.getItem(LSN)||''; }catch(e){}
 function save(){ try{ localStorage.setItem(LSK,JSON.stringify(cart)); }catch(e){} }
 function keys(){ return Object.keys(cart); }
 function count(){ let n=0; keys().forEach(function(k){ n+=cart[k].q; }); return n; }
 function updFab(){ $('cartCnt').textContent=count(); $('cartFab').classList.toggle('has',count()>0); }
 function stockOf(sku){ try{ const c=classify(sku); return (c&&c.n!=null)?c.n:null; }catch(e){ return null; } }
 function add(sku,nom,col){
  const it=cart[sku]||{q:0,n:nom,c:col}; it.q+=1;
  const s=stockOf(sku);
  if(s!=null&&s>0&&it.q>s){ it.q=s; toast('Máximo con stock: '+s); }
  else if(s===0){ toast('Ojo: sin stock — va como consulta'); }
  else { toast('Agregado ✓ ('+it.q+')'); }
  cart[sku]=it; save(); updFab(); renderCart();
 }
 function setQ(sku,q){ if(!cart[sku])return; q=Math.max(0,q|0);
  const s=stockOf(sku); if(s!=null&&s>0&&q>s){ q=s; toast('Máximo con stock: '+s); }
  if(q<=0){ delete cart[sku]; } else { cart[sku].q=q; }
  save(); updFab(); renderCart(); }
 function renderCart(){
  const ks=keys(), box=$('cartItems');
  if(!ks.length){ box.innerHTML='<div class="cempty">Todavía no agregaste productos.<br>Usá el botón <b>＋</b> de cada artículo.</div>'; }
  else{ box.innerHTML=ks.map(function(k){ const it=cart[k]; const s=stockOf(k);
   return '<div class="citem"><div class="ci"><div class="cn">'+it.n+(it.c?' · '+it.c:'')+'</div>'+
    '<div class="ck">'+k+(s!=null?' · stock: '+s:'')+'</div></div>'+
    '<div class="cq"><button data-cq="-1" data-k="'+k+'">−</button><b>'+it.q+'</b>'+
    '<button data-cq="1" data-k="'+k+'">＋</button><button class="cx" data-cx="'+k+'">✕</button></div></div>'; }).join(''); }
  $('cartTot').innerHTML= ks.length? '<b>'+ks.length+'</b> producto(s) · <b>'+count()+'</b> bulto(s)':'';
 }
 function proforma(){
  const d=new Date();
  const f=d.toLocaleDateString('es-AR')+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  let t='🛒 *PEDIDO / PROFORMA*\n*App GM · Grupo Mundo*\nFecha: '+f+'\n——————————\n';
  keys().forEach(function(k,i){ const it=cart[k];
   t+=(i+1)+') *'+it.q+' x* '+k+'\n     '+it.n+(it.c?' · '+it.c:'')+'\n'; });

 }
